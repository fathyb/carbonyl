[package]
name = "mongoose-tui"
version = "0.0.3"
edition = "2021"
authors = ["orpheus497"]
description = "Terminal-native, privacy-first web browser with hybrid rendering"
license = "MIT"

[dependencies]
# TUI framework
ratatui = "0.26"
crossterm = "0.27"

# Error handling
anyhow = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Path to libmongoose (will be built as part of the workspace)
libmongoose = { path = "../", package = "mongoose" }

[[bin]]
name = "mongoose"
path = "src/main.rs"
